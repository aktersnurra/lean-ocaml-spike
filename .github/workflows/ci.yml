# Clean build of the whole spike with the pinned toolchain (versions.env), then every gate.
# First cold run passed in 1h31m (bootstrap 88 min). The opam root is cached on the hash of
# versions.env + bootstrap.sh because the peregrine switch (Rocq, MetaRocq, CertiRocq,
# CompCert: 82 packages) takes about 1.5 hours to build cold.
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPAMYES: "1"
      OPAMCONFIRMLEVEL: unsafe-yes
    steps:
      - uses: actions/checkout@v7
      # clang: conf-clang (needed by rocq-certirocq). Without it here, opam installs it on the cold
      # run via depext, then on every warm run sees it missing ("system changes") and rebuilds
      # conf-clang -> rocq-certirocq -> rocq-peregrine (35 min instead of seconds).
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y opam libgmp-dev bubblewrap m4 pkg-config unzip rsync clang
      - name: Restore opam root
        uses: actions/cache@v6
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-${{ hashFiles('versions.env', 'scripts/bootstrap.sh') }}
      - name: opam init
        run: test -d ~/.opam || opam init --bare --disable-sandboxing -n -y
      - name: elan (Lean toolchain from domain/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Bootstrap opam switches
        run: scripts/bootstrap.sh
      - name: Gate 1a (ocamlfind link) and 1b (Dune)
        run: scripts/gate1.sh && scripts/gate1b.sh
      - name: Gate 2 (byte boundary)
        run: scripts/gate2.sh && experiments/gate2b/run.sh
      - name: Gate 3 (tests, differential fuzz, audit, benchmark)
        run: scripts/gate3.sh
      - name: Interface generator (generated client up to date, differential tests)
        run: scripts/gen.sh
      - name: Gate 3 OCaml 5 (domains, Eio, generated client)
        run: scripts/gate3-ocaml5.sh
